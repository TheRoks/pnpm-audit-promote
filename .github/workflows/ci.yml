name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run test
      - run: pnpm run build
      - name: Requirements traceability
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: pnpm run traceability:strict
      - name: publint
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: pnpm run check:exports

  # Smoke-test the built CLI against a workspace that uses pnpm 11. The
  # toolchain itself stays on pnpm 10 (see packageManager in package.json),
  # so this job uses npm to install pnpm@11 globally rather than relying on
  # corepack/pnpm-action-setup picking it up.
  integration-pnpm11:
    name: Integration (pnpm 11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install repo deps and build CLI (with pnpm 10)
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Install pnpm 11 alongside pnpm 10
        run: npm install -g pnpm@11
      - name: Smoke test against examples/pnpm11 (dry-run)
        run: |
          pnpm --version
          node dist/cli.js --path examples/pnpm11 --force --no-audit --dry-run --no-summary
      - name: Exercise pnpm 11 audit path and verify minimumReleaseAge restore
        run: |
          tmp_dir="$(mktemp -d)"
          cp -R examples/pnpm11 "$tmp_dir/workspace"
          node dist/cli.js --path "$tmp_dir/workspace" --force --no-summary --no-dedupe
          grep -q '^minimumReleaseAge: 720$' "$tmp_dir/workspace/pnpm-workspace.yaml"
          if grep -q '^minimumReleaseAge: 0$' "$tmp_dir/workspace/pnpm-workspace.yaml"; then
            echo 'temporary minimumReleaseAge override leaked into final workspace yaml'
            exit 1
          fi

  # Real-pnpm integration tests under tests/integration/. Gated by
  # RUN_INTEGRATION=1 (see scripts/run-integration.mjs). Uses fixtures with
  # a pinned-vulnerable lodash@4.17.20 to exercise the full audit + promote
  # flow against pnpm 10 and pnpm 11. Path-filtered to source / integration
  # changes so PRs touching only docs don't pay the install cost.
  integration:
    name: Integration (pnpm ${{ matrix.pnpm-major }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pnpm-major: [10, 11]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install repo deps (with pnpm 10 toolchain)
        run: pnpm install --frozen-lockfile
      - name: Install pnpm ${{ matrix.pnpm-major }} as the integration target
        if: matrix.pnpm-major != 10
        run: npm install -g pnpm@${{ matrix.pnpm-major }}
      - name: Run integration suite
        env:
          RUN_INTEGRATION: '1'
          INTEGRATION_PNPM_MAJOR: ${{ matrix.pnpm-major }}
        run: pnpm run test:integration
