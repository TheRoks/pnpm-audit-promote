name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run test
      - run: pnpm run build
      - name: Requirements traceability
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: pnpm run traceability:strict
      - name: publint
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: pnpm run check:exports

  # Smoke-test the built CLI against a workspace that uses pnpm 11. The repo
  # toolchain follows the exact packageManager pin in package.json.
  integration-pnpm11:
    name: Integration (pnpm 11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install repo deps and build CLI (with repo pnpm pin)
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Install pnpm 11 target
        run: npm install -g pnpm@11.1.2
      - name: Smoke test against examples/pnpm11 (dry-run)
        run: |
          pnpm --version
          node dist/cli.js --path examples/pnpm11 --force --no-audit --dry-run --no-summary
      - name: Exercise pnpm 11 audit path and verify minimumReleaseAge restore
        run: |
          tmp_dir="$(mktemp -d)"
          cp -R examples/pnpm11 "$tmp_dir/workspace"
          node dist/cli.js --path "$tmp_dir/workspace" --force --no-summary --no-dedupe
          grep -q '^minimumReleaseAge: 720$' "$tmp_dir/workspace/pnpm-workspace.yaml"
          if grep -q '^minimumReleaseAge: 0$' "$tmp_dir/workspace/pnpm-workspace.yaml"; then
            echo 'temporary minimumReleaseAge override leaked into final workspace yaml'
            exit 1
          fi

  # Real-pnpm integration tests under tests/integration/. Gated by
  # RUN_INTEGRATION=1 (see scripts/run-integration.mjs). Uses fixtures with
  # a pinned-vulnerable lodash@4.17.20 to exercise the full audit + promote
  # flow against pnpm 10, 11, and 12. pnpm 12 also runs on macOS and Windows
  # to cover its native executables across supported CI platforms.
  integration:
    name: Integration (pnpm ${{ matrix.pnpm-major }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pnpm-major: 10
            pnpm-version: 10.33.0
          - os: ubuntu-latest
            pnpm-major: 11
            pnpm-version: 11.1.2
          - os: ubuntu-latest
            pnpm-major: 12
            pnpm-version: 12.8.1
          - os: macos-latest
            pnpm-major: 12
            pnpm-version: 12.8.1
          - os: windows-latest
            pnpm-major: 12
            pnpm-version: 12.8.1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install repo dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pnpm ${{ matrix.pnpm-version }} as the integration target
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/pnpm-target" "pnpm@${{ matrix.pnpm-version }}"
          echo "$RUNNER_TEMP/pnpm-target/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Run integration suite
        env:
          RUN_INTEGRATION: '1'
          INTEGRATION_PNPM_MAJOR: ${{ matrix.pnpm-major }}
        run: node scripts/run-integration.mjs
